<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Перевірка домашніх завдань · HTML</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAFAF8;
    --grid:#D7E3ED;
    --ink:#1F2A37;
    --ink-soft:#5B6674;
    --red:#C81D25;
    --red-soft:#F4D9DA;
    --green:#1E7A46;
    --green-soft:#DCEEE1;
    --amber:#B9770E;
    --amber-soft:#FBEBD3;
    --card:#FFFFFF;
    --line:#E3E0D4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/100% 28px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/28px 100%,
      var(--paper);
    background-attachment:local;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:32px 20px 60px;
  }
  .wrap{max-width:1080px;margin:0 auto;}
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  h1{
    font-family:'Kalam',cursive;
    font-size:34px;
    color:var(--red);
    margin:0;
    transform:rotate(-1deg);
  }
  .sub{color:var(--ink-soft);font-size:14px;margin-top:4px;}
  nav.tabs{display:flex;gap:8px;}
  nav.tabs button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:9px 18px;
    background:var(--card);
    border:1px solid var(--line);
    border-bottom:3px solid var(--line);
    border-radius:8px 8px 0 0;
    cursor:pointer;
    color:var(--ink-soft);
  }
  nav.tabs button.active{
    color:var(--ink);
    border-bottom:3px solid var(--red);
    background:var(--card);
  }
  section{display:none;}
  section.active{display:block;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:22px 24px;
    margin-bottom:20px;
  }
  .card h2{font-size:17px;margin:0 0 12px;font-weight:600;}
  .card h3{font-size:14px;margin:0 0 8px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  label{font-size:13px;color:var(--ink-soft);display:block;margin-bottom:6px;}
  input[type=text]{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:15px;
    font-family:'Inter',sans-serif;
    background:#fff;
  }
  input[type=text]:focus{outline:2px solid var(--red-soft);border-color:var(--red);}
  .btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:10px 20px;
    border-radius:8px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    cursor:pointer;
  }
  .btn:hover{background:#374151;}
  .btn.secondary{background:#fff;color:var(--ink);border-color:var(--line);}
  .btn.secondary:hover{background:#f3f2ee;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .task-box{
    background:var(--amber-soft);
    border:1px dashed var(--amber);
    border-radius:10px;
    padding:16px 18px;
    font-size:14px;
    line-height:1.6;
  }
  .task-box b{color:#7A5209;}
  .swatch{
    display:inline-block;width:14px;height:14px;border-radius:3px;
    vertical-align:-2px;margin-right:4px;border:1px solid rgba(0,0,0,.15);
  }
  .editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:820px){.editor-grid{grid-template-columns:1fr;}}
  textarea{
    width:100%;
    height:360px;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    line-height:1.5;
    padding:14px;
    border:1px solid var(--line);
    border-radius:8px;
    resize:vertical;
    background:#fff;
    color:var(--ink);
  }
  iframe{
    width:100%;
    height:360px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
  }
  .meta-row{display:flex;gap:16px;margin-top:10px;font-size:12px;color:var(--ink-soft);flex-wrap:wrap;}
  .flag{
    display:inline-flex;align-items:center;gap:5px;
    padding:2px 8px;border-radius:20px;font-weight:600;font-size:11px;
  }
  .flag.ok{background:var(--green-soft);color:var(--green);}
  .flag.warn{background:var(--red-soft);color:var(--red);}
  .checklist{list-style:none;margin:14px 0 0;padding:0;font-size:13px;}
  .checklist li{
    display:flex;align-items:center;gap:8px;padding:5px 0;
    border-bottom:1px solid #F0EEE6;
  }
  .checklist li:last-child{border-bottom:none;}
  .dot{width:16px;height:16px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700;}
  .dot.pass{background:var(--green);}
  .dot.fail{background:var(--red);}
  .stamp{
    font-family:'Kalam',cursive;
    font-size:20px;
    color:var(--red);
    border:2px solid var(--red);
    border-radius:8px;
    padding:6px 16px;
    display:inline-block;
    transform:rotate(-3deg);
    margin-top:10px;
  }
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--ink-soft);padding:8px 10px;border-bottom:2px solid var(--ink);
  }
  td{padding:9px 10px;border-bottom:1px solid #EFEDE5;vertical-align:middle;}
  tr.row:hover{background:#FAFAF5;cursor:pointer;}
  .score{font-weight:700;}
  .score.good{color:var(--green);}
  .score.bad{color:var(--red);}
  .empty{
    text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:14px;
  }
  .modal-bg{
    position:absolute;inset:0;background:rgba(31,42,55,.5);
    display:flex;align-items:flex-start;justify-content:center;
    padding:40px 20px;z-index:10;
  }
  .modal{
    background:#fff;border-radius:12px;max-width:900px;width:100%;
    padding:24px;max-height:85vh;overflow:auto;
  }
  .modal-close{float:right;background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-soft);}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:8px;}
  code{background:#F0EEE6;padding:1px 5px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:12px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const PRODUCTS = [
  "Велосипед гірський Trail Master",
  "Велосипед міський Comfort Pro",
  "Велосипед підлітковий Rider X",
  "Велосипед BMX Jump",
  "Велосипед електро E-Speed",
  "Велосипед шосейний Road Runner",
  "Велосипед дитячий Mini Wheels",
  "Велосипед складний Fold&Go",
  "Велосипед фетбайк Snow King",
  "Велосипед круїзер Beach Wave"
];
const COLORS = [
  {name:"теракотовий", hex:"#C1440E"},
  {name:"синій", hex:"#2C5F8A"},
  {name:"зелений", hex:"#3B7A57"},
  {name:"фіолетовий", hex:"#6C4F77"},
  {name:"помаранчевий", hex:"#D97706"},
  {name:"бірюзовий", hex:"#128C8C"},
  {name:"малиновий", hex:"#A31545"},
  {name:"хакі", hex:"#6B7A3A"}
];

function hashCode(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function slugify(str){
  // Слова сортуються, тож «Анна Соколенко» і «Соколенко Анна» дають один ідентифікатор.
  const words = str.trim().toLowerCase().replace(/ё/g,'е').split(/[^a-zа-яіїєґ0-9]+/i).filter(Boolean);
  return words.sort().join('-') || 'student';
}
// Позначка на цьому пристрої: після здачі роботу повторно здати з цього браузера не вийде.
function isDoneLocally(){
  try{ return !!localStorage.getItem('homework-done'); }catch(e){ return false; }
}
function markDoneLocally(){
  try{ localStorage.setItem('homework-done','1'); }catch(e){}
}
function getAssignment(name){
  // Завдання залежить від ідентифікатора, тож порядок слів в імені його не змінює.
  const h = hashCode(slugify(name));
  const product = PRODUCTS[h % PRODUCTS.length];
  const color = COLORS[Math.floor(h/17) % COLORS.length];
  const price = 4900 + (h % 45) * 200;
  return {product, color, price};
}

function starterCode(){
  return `<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <style type="text/css">
        .card {
            background-color: #fff;
            width: 200px;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 10px 10px 40px #434040;
            margin: auto;
            margin-top: 60px;
        }
        .card-title {
            margin: 10px 0;
            font-size: 22px;
            font-weight: 500;
        }
        .price {
            font-weight: 600;
            color: #333;
            margin-top: 10px;
        }
        .btn-keeper {
            margin-top: 20px;
            text-align: center;
        }
        .btn {
            /* задай тут background-color своїм кольором */
            padding: 7px 12px;
            text-decoration: none;
            color: #eee;
            border-radius: 5px;
        }
    </style>
    <title>Товар</title>
</head>
<body>
    <div class="card">
        <img src="bike.jpg">

        <div class="card-title"><!-- впиши сюди назву свого товару --></div>

        <div>Недорогий велосипед для регулярного катання</div>

        <!-- додай тут div class="price" з ціною -->

        <div class="btn-keeper">
            <a class="btn" href="#">Купити</a>
        </div>
    </div>
</body>
</html>`;
}

// Вставте сюди URL вашого опублікованого Google Apps Script Web App
// (закінчується на /exec). Поки тут плейсхолдер, сайт покаже попередження.
// Вставте сюди URL вашого опублікованого Google Apps Script Web App
// (закінчується на /exec). Поки тут плейсхолдер, сайт покаже попередження.
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwV-7uv0mb15o2c3wFyFlG6RHiPoYqLOgTXXHA2bg8620b4SwQh8kljiqajZYDwSgeD/exec';

// Пароль для входу в режим викладача. Поміняйте на свій.
const TEACHER_PASSCODE = 'вчитель2026';

let state = {
  role: 'select',
  studentName: '',
  studentId: '',
  code: '',
  pasteCount: 0,
  keyCount: 0,
  submitted: false,
  alreadySubmitted: false,
  teacherRows: [],
  modalKey: null,
  teacherUnlocked: false
};

function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function runChecks(code, assignment){
  const lc = code.toLowerCase();
  const checks = [
    {
      id:'card', label:'Є контейнер картки (div class="card")',
      pass: /<div[^>]*class=["'][^"']*card[^"']*["']/i.test(code)
    },
    {
      id:'title', label:'У назві товару — свій персональний товар',
      pass: code.includes(assignment.product)
    },
    {
      id:'color', label:'Колір кнопки замінено на виданий (' + assignment.color.hex + ')',
      pass: lc.includes(assignment.color.hex.toLowerCase())
    },
    {
      id:'price', label:'Додано блок з ціною (' + assignment.price.toLocaleString('uk-UA') + ' ₴)',
      pass: code.replace(/[\s\u00A0]/g,'').includes(String(assignment.price)) && /₴|грн/i.test(code)
    },
    {
      id:'alt', label:'У картинки заповнено атрибут alt',
      pass: /<img[^>]*alt=["'][^"']+["']/i.test(code)
    },
    {
      id:'structure', label:'Збережено базову структуру (html, head, body)',
      pass: /<html[\s\S]*<head[\s\S]*<\/head>[\s\S]*<body[\s\S]*<\/body>[\s\S]*<\/html>/i.test(code)
    }
  ];
  return checks;
}

function backendConfigured(){
  return APPS_SCRIPT_URL && APPS_SCRIPT_URL.indexOf('ВСТАВЬТЕ') === -1;
}

async function saveSubmission(record){
  if(!backendConfigured()) return {ok:false, error:'not_configured'};
  try{
    // Content-Type: text/plain навмисно, щоб уникнути CORS-preflight,
    // який Apps Script за замовчуванням не обробляє. Сервер сам
    // розпарсить JSON із тіла запиту.
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(record)
    });
    return await res.json();
  }catch(e){
    console.error('submit error', e);
    return {ok:false, error:'network'};
  }
}

async function loadAllSubmissions(){
  if(!backendConfigured()) return [];
  try{
    const res = await fetch(APPS_SCRIPT_URL, {cache:'no-store'});
    const rows = await res.json();
    rows.sort((a,b)=> (b.submittedAt||0) - (a.submittedAt||0));
    return rows;
  }catch(e){
    console.error('load error', e);
    return [];
  }
}

function teacherTabVisible(){
  const params = new URLSearchParams(location.search);
  return params.has('admin') || state.teacherUnlocked || state.role === 'teacher';
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(!backendConfigured()){
    app.appendChild(el(`
      <div class="card" style="border:1px solid var(--red);background:var(--red-soft);">
        <b style="color:var(--red);">Бекенд не налаштовано.</b>
        Відкрийте <code>index.html</code> і замініть <code>APPS_SCRIPT_URL</code>
        на адресу вашого опублікованого Google Apps Script Web App.
        До цього збереження і журнал працювати не будуть.
      </div>
    `));
  }
  const showTeacherTab = teacherTabVisible();
  app.appendChild(el(`
    <header>
      <div>
        <h1>Журнал HTML-практикуму</h1>
        <div class="sub">Персональні завдання, відстеження вставки коду, автоперевірка</div>
      </div>
      <nav class="tabs">
        <button data-role="student" class="${state.role==='student'||state.role==='select'?'active':''}">Я студент</button>
        ${showTeacherTab ? `<button data-role="teacher" class="${state.role==='teacher'?'active':''}">Я викладач</button>` : ''}
      </nav>
    </header>
  `));
  app.querySelectorAll('nav.tabs button').forEach(b=>{
    b.addEventListener('click', ()=>{
      state.role = b.dataset.role;
      if(state.role==='teacher' && state.teacherUnlocked){ refreshTeacher(); }
      render();
    });
  });

  const section = document.createElement('section');
  section.className = 'active';
  app.appendChild(section);

  if(state.role === 'teacher'){
    renderTeacher(section);
  }else{
    renderStudent(section);
  }
}

function renderStudent(section){
  if(state.alreadySubmitted || (isDoneLocally() && !state.submitted)){
    section.appendChild(el(`
      <div class="card">
        <h2>Роботу вже здано</h2>
        <p>Відповідь уже зафіксовано. Повторна здача можлива лише з дозволу викладача.</p>
      </div>
    `));
    return;
  }
  if(!state.studentName){
    section.appendChild(el(`
      <div class="card" style="max-width:420px;">
        <h2>Представся</h2>
        <label for="name-input">Ім'я та прізвище</label>
        <input type="text" id="name-input" placeholder="Наприклад: Анна Соколенко" />
        <div style="margin-top:14px;">
          <button class="btn" id="start-btn">Отримати завдання</button>
        </div>
        <p class="hint">Кожному студенту видається свій унікальний товар, колір кнопки та ціна — завдання в усіх різні.</p>
      </div>
    `));
    section.querySelector('#start-btn').addEventListener('click', ()=>{
      const name = section.querySelector('#name-input').value.trim();
      if(!name){
        section.querySelector('#name-input').style.borderColor = 'var(--red)';
        return;
      }
      state.studentName = name;
      state.studentId = slugify(name);
      state.code = starterCode();
      render();
    });
    section.querySelector('#name-input').addEventListener('keydown', e=>{
      if(e.key==='Enter') section.querySelector('#start-btn').click();
    });
    return;
  }

  const assignment = getAssignment(state.studentName);

  section.appendChild(el(`
    <div class="card">
      <h2>Завдання для ${state.studentName}</h2>
      <div class="task-box">
        Твій товар: <b>${assignment.product}</b><br>
        1. Заміни текст у <code>.card-title</code> на назву свого товару.<br>
        2. Задай кнопці <code>.btn</code> колір <span class="swatch" style="background:${assignment.color.hex}"></span><b>${assignment.color.hex}</b> (${assignment.color.name}) через <code>background-color</code>.<br>
        3. Додай <code>&lt;div class="price"&gt;</code> з ціною <b>${assignment.price.toLocaleString('uk-UA')} ₴</b>.<br>
        4. Заповни <code>alt</code> у картинки назвою товару.
      </div>
    </div>
  `));

  const editorCard = el(`
    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0;">Код і попередній перегляд</h2>
        <span style="flex:1;"></span>
        <button class="btn secondary" id="check-btn">Перевірити</button>
        <button class="btn" id="submit-btn">Здати завдання</button>
      </div>
      <div class="editor-grid">
        <div>
          <h3>Редактор</h3>
          <textarea id="code-area" spellcheck="false"></textarea>
        </div>
        <div>
          <h3>Попередній перегляд</h3>
          <iframe id="preview-frame" sandbox="allow-same-origin"></iframe>
        </div>
      </div>
      <div class="meta-row">
        <span id="flag-paste" class="flag ok">Вставку не виявлено</span>
        <span id="key-count">Символів надруковано: 0</span>
      </div>
      <div id="check-results"></div>
      <div id="stamp-holder"></div>
    </div>
  `);
  section.appendChild(editorCard);

  const textarea = editorCard.querySelector('#code-area');
  const frame = editorCard.querySelector('#preview-frame');
  textarea.value = state.code;
  frame.srcdoc = state.code;

  function updatePreview(){
    frame.srcdoc = textarea.value;
  }
  textarea.addEventListener('input', (e)=>{
    state.code = textarea.value;
    if(e.inputType && e.inputType.startsWith('insert') && e.inputType !== 'insertFromPaste'){
      state.keyCount++;
    }
    editorCard.querySelector('#key-count').textContent = 'Символів надруковано: ' + state.keyCount;
    updatePreview();
  });
  textarea.addEventListener('paste', ()=>{
    state.pasteCount++;
    const flag = editorCard.querySelector('#flag-paste');
    flag.textContent = 'Вставку виявлено: ' + state.pasteCount + (state.pasteCount===1?' раз':' рази(ів)');
    flag.className = 'flag warn';
  });

  function showChecks(){
    const checks = runChecks(state.code, assignment);
    const list = document.createElement('ul');
    list.className = 'checklist';
    checks.forEach(c=>{
      list.appendChild(el(`
        <li><span class="dot ${c.pass?'pass':'fail'}">${c.pass?'✓':'✕'}</span> ${c.label}</li>
      `));
    });
    const holder = editorCard.querySelector('#check-results');
    holder.innerHTML = '';
    holder.appendChild(list);
    return checks;
  }

  editorCard.querySelector('#check-btn').addEventListener('click', showChecks);

  editorCard.querySelector('#submit-btn').addEventListener('click', async ()=>{
    const checks = showChecks();
    const passCount = checks.filter(c=>c.pass).length;
    const record = {
      studentName: state.studentName,
      studentId: state.studentId,
      code: state.code,
      assignment: assignment,
      checks: checks,
      passCount: passCount,
      totalChecks: checks.length,
      pasteCount: state.pasteCount,
      keyCount: state.keyCount,
      submittedAt: Date.now()
    };
    editorCard.querySelector('#submit-btn').disabled = true;
    editorCard.querySelector('#submit-btn').textContent = 'Надсилання…';
    const result = await saveSubmission(record);
    editorCard.querySelector('#submit-btn').disabled = false;
    editorCard.querySelector('#submit-btn').textContent = 'Здати завдання';
    const stampHolder = editorCard.querySelector('#stamp-holder');
    stampHolder.innerHTML = '';
    if(result.ok || result.error === 'already_submitted'){
      markDoneLocally();
      state.submitted = true;
      // Після здачі редактор і кнопки блокуються.
      textarea.readOnly = true;
      editorCard.querySelector('#submit-btn').disabled = true;
      editorCard.querySelector('#check-btn').disabled = true;
      if(result.ok){
        stampHolder.appendChild(el(`<div class="stamp">Здано · перевірено ${passCount}/${checks.length}</div>`));
      }else{
        stampHolder.appendChild(el(`<div class="stamp" style="color:var(--amber);border-color:var(--amber);">Роботу вже здано раніше. Повторна здача лише з дозволу викладача</div>`));
      }
    }else{
      stampHolder.appendChild(el(`<div class="stamp" style="color:var(--amber);border-color:var(--amber);">Помилка надсилання, спробуй ще раз</div>`));
    }
  });

  section.appendChild(el(`
    <p class="hint">Дані видно твоєму викладачу (спільне сховище завдання). Особисті дані не збираються, окрім введеного імені.</p>
  `));
}

function renderTeacher(section){
  if(!state.teacherUnlocked){
    section.appendChild(el(`
      <div class="card" style="max-width:380px;">
        <h2>Вхід для викладача</h2>
        <label for="passcode-input">Пароль</label>
        <input type="text" id="passcode-input" placeholder="Введіть пароль" />
        <div style="margin-top:14px;">
          <button class="btn" id="unlock-btn">Увійти</button>
        </div>
        <p class="hint" id="passcode-error" style="color:var(--red);"></p>
      </div>
    `));
    const input = section.querySelector('#passcode-input');
    const tryUnlock = async ()=>{
      if(input.value === TEACHER_PASSCODE){
        state.teacherUnlocked = true;
        await refreshTeacher();
        render();
      }else{
        section.querySelector('#passcode-error').textContent = 'Невірний пароль';
        input.style.borderColor = 'var(--red)';
      }
    };
    section.querySelector('#unlock-btn').addEventListener('click', tryUnlock);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
    return;
  }
  section.appendChild(el(`
    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0;">Роботи студентів</h2>
        <span style="flex:1;"></span>
        <button class="btn secondary" id="refresh-btn">Оновити список</button>
        <button class="btn secondary" id="export-btn">Завантажити CSV</button>
      </div>
      <div id="teacher-table-holder"><div class="empty">Завантаження…</div></div>
    </div>
  `));
  section.querySelector('#refresh-btn').addEventListener('click', async ()=>{
    await refreshTeacher();
    renderTeacherTable(section);
  });
  section.querySelector('#export-btn').addEventListener('click', exportCSV);
  renderTeacherTable(section);
}

async function refreshTeacher(){
  state.teacherRows = await loadAllSubmissions();
}

function renderTeacherTable(section){
  const holder = section.querySelector('#teacher-table-holder');
  if(!holder) return;
  if(state.teacherRows.length === 0){
    holder.innerHTML = '';
    holder.appendChild(el(`<div class="empty">Поки ніхто не здав завдання. Натисни «Оновити список», коли студенти почнуть надсилати роботи.</div>`));
    return;
  }
  const table = el(`
    <table>
      <thead>
        <tr>
          <th>Студент</th>
          <th>Перевірки</th>
          <th>Вставка коду</th>
          <th>Символів надруковано</th>
          <th>Здано</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  `);
  const tbody = table.querySelector('tbody');
  state.teacherRows.forEach(r=>{
    const good = r.passCount === r.totalChecks;
    const time = r.submittedAt ? new Date(r.submittedAt).toLocaleString('uk-UA') : '—';
    const row = el(`
      <tr class="row" data-key="${r.studentId}">
        <td>${r.studentName}</td>
        <td class="score ${good?'good':'bad'}">${r.passCount}/${r.totalChecks}</td>
        <td>${r.pasteCount>0 ? '<span class="flag warn">'+r.pasteCount+'</span>' : '<span class="flag ok">нет</span>'}</td>
        <td>${r.keyCount||0}</td>
        <td>${time}</td>
      </tr>
    `);
    row.addEventListener('click', ()=> openModal(r));
    tbody.appendChild(row);
  });
  holder.innerHTML = '';
  holder.appendChild(table);
}

function openModal(record){
  const wrap = document.getElementById('app');
  const bg = el(`<div class="modal-bg"></div>`);
  const checksHtml = record.checks.map(c=>`
    <li><span class="dot ${c.pass?'pass':'fail'}">${c.pass?'✓':'✕'}</span> ${c.label}</li>
  `).join('');
  const modal = el(`
    <div class="modal">
      <button class="modal-close">✕ закрити</button>
      <h2>${record.studentName}</h2>
      <p class="hint">Завдання: ${record.assignment.product} · колір ${record.assignment.color.hex} · ціна ${record.assignment.price.toLocaleString('uk-UA')} ₴</p>
      <ul class="checklist">${checksHtml}</ul>
      <div class="meta-row" style="margin:14px 0;">
        <span>${record.pasteCount>0 ? '<span class="flag warn">Вставок коду: '+record.pasteCount+'</span>' : '<span class="flag ok">Вставку не виявлено</span>'}</span>
        <span>Символів надруковано: ${record.keyCount||0}</span>
      </div>
      <div class="editor-grid">
        <div>
          <h3>Код</h3>
          <textarea readonly style="height:320px;">${record.code.replace(/</g,'&lt;')}</textarea>
        </div>
        <div>
          <h3>Попередній перегляд</h3>
          <iframe sandbox="allow-same-origin" style="height:320px;"></iframe>
        </div>
      </div>
    </div>
  `);
  modal.querySelector('.modal-close').addEventListener('click', ()=> bg.remove());
  bg.addEventListener('click', (e)=>{ if(e.target===bg) bg.remove(); });
  bg.appendChild(modal);
  document.body.style.position='relative';
  wrap.appendChild(bg);
  modal.querySelector('iframe').srcdoc = record.code;
}

function exportCSV(){
  if(state.teacherRows.length===0) return;
  const header = ['Ім\'я','Пройдено перевірок','Усього перевірок','Вставок коду','Символів надруковано','Дата здачі'];
  const lines = [header.join(';')];
  state.teacherRows.forEach(r=>{
    const time = r.submittedAt ? new Date(r.submittedAt).toLocaleString('uk-UA') : '';
    lines.push([r.studentName, r.passCount, r.totalChecks, r.pasteCount, r.keyCount||0, time].join(';'));
  });
  const blob = new Blob(['\ufeff'+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'html-homework-report.csv';
  a.click();
}

render();
</script>
</body>
</html>
